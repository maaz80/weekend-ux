name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [admin_content_update]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: .
        run: |
          npm install

      - name: Build static site
        working-directory: .
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          npm run build

      - name: Check export folder
        run: |
          if [ -d "out" ]; then echo "OUT_EXISTS=true"; else echo "OUT_EXISTS=false"; fi
          ls -la out || true

      - name: Upload to Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER != '' && secrets.FTP_SERVER || 'weekendux.in' }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -e "set ssl:verify-certificate no; set ftp:ssl-force false; set ftp:passive-mode true; set net:timeout 20; set net:max-retries 2; set cmd:fail-exit true; mirror -R --delete --verbose ./out/ /public_html/; bye" -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
